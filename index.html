<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Sound Recognition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Smart Sound Recognition</h1>
      <p>Clap, whistle, or stay quiet. The model listens through your microphone and tells you what it hears.</p>
    </header>

    <section class="stage" aria-live="polite">
      <div class="orb idle" id="orb">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <div class="core">
          <span class="icon" id="icon">🎙️</span>
          <span class="name" id="name">Ready</span>
          <span class="conf" id="conf">Press start to begin</span>
        </div>
      </div>

      <div class="controls">
        <button id="toggleBtn" class="primary">Start listening</button>
      </div>
      <p id="status" class="status">Model not loaded yet.</p>
    </section>

    <section class="panels">
      <div class="panel">
        <h2>Confidence</h2>
        <div id="bars" class="bars"></div>
      </div>

      <div class="panel">
        <h2>Recent sounds</h2>
        <ul id="log" class="log">
          <li class="empty">Nothing detected yet.</li>
        </ul>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
